syntax = "proto3";

package raftkv;

option go_package = "raftkv/proto";

message LogEntry {
  int64 term = 1;
  int64 index = 2;
  bytes command = 3;
}

message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool ok = 1;
  string value = 2;
  bool found = 3;
  string error = 4;
  string leader_id = 5;
  string leader_addr = 6;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool ok = 1;
  string error = 2;
  string leader_id = 3;
  string leader_addr = 4;
}

message StatusRequest {}

message StatusResponse {
  string id = 1;
  string state = 2;
  int64 term = 3;
  string leader_id = 4;
  string leader_addr = 5;
  string voted_for = 6;
  int64 commit_index = 7;
  int64 last_applied = 8;
  int64 last_log_index = 9;
  int64 kv_size = 10;
  repeated string peers = 11;
}

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}
